name: munasaba
description: "مناسبة - تطبيق تنظيم المناسبات والدعوات"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

  # Images
  image_picker: ^1.1.2

  # Contacts
  flutter_contacts: ^1.1.9+2

  # Sharing & screenshots (invitation card save/share)
  share_plus: ^9.0.0
  screenshot: ^3.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Dates / formatting (Arabic)
  intl: ^0.19.0

  # Fonts
  google_fonts: ^6.2.1

  # Unique ids
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # عند إضافة صور افتراضية (avatar_male.png / avatar_female.png) ضعها في assets/images
  # ثم أضف هنا:
  # assets:
  #   - assets/images/
